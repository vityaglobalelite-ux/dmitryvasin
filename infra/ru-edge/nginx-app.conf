root /srv/dmitryvasin/current;
index index.html;

server_tokens off;
charset utf-8;
client_max_body_size 1m;

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/plain
    text/xml;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;

location = /__edge-health {
    access_log off;
    default_type text/plain;
    return 200 "ru-edge-ok\n";
}

# Only the two read-only Supabase resources used by the landing page.
location = /edge-supabase/rest/v1/tariff_prices {
    rewrite ^/edge-supabase/(.*)$ /$1 break;
    proxy_pass https://api.betango.dance;
    proxy_ssl_server_name on;
    proxy_ssl_name api.betango.dance;
    proxy_set_header Host api.betango.dance;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}

location = /edge-supabase/rest/v1/bot_settings {
    rewrite ^/edge-supabase/(.*)$ /$1 break;
    proxy_pass https://api.betango.dance;
    proxy_ssl_server_name on;
    proxy_ssl_name api.betango.dance;
    proxy_set_header Host api.betango.dance;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}

location ^~ /edge-supabase/ {
    return 404;
}

location ^~ /_next/static/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
}

location ^~ /media/ {
    alias /srv/dmitryvasin/shared/media/;
    access_log off;
    expires 30d;
}

location ^~ /assets/ {
    try_files $uri =404;
    expires 7d;
}

# Separate site from the root landing. Lives in shared/ so root
# releases (ln -sfn .../current) cannot replace or delete it.
location = /privateclub {
    return 301 /privateclub/$is_args$args;
}

location ^~ /privateclub/_next/static/ {
    root /srv/dmitryvasin/shared;
    try_files $uri =404;
    access_log off;
    expires 1y;
}

location ^~ /privateclub/assets/ {
    root /srv/dmitryvasin/shared;
    try_files $uri =404;
    expires 7d;
}

location ^~ /privateclub/ {
    root /srv/dmitryvasin/shared;
    try_files $uri $uri/ /privateclub/index.html =404;
    expires -1;
}

location ~ /\.(?!well-known/) {
    deny all;
}

location / {
    try_files $uri $uri/ /index.html =404;
    expires -1;
}
