server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name dmitryvasin.com ru-edge.dmitryvasin.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    server_name ru-edge.dmitryvasin.com;

    ssl_certificate /etc/letsencrypt/live/ru-edge.dmitryvasin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ru-edge.dmitryvasin.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/dmitryvasin-app.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name dmitryvasin.com;

    # Temporary cutover copy; replaced with Certbot-managed paths after DNS switches.
    ssl_certificate /etc/nginx/tls/dmitryvasin.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/dmitryvasin.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/dmitryvasin-app.conf;
}
