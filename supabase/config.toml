# Minimal config for Edge Functions (self-hosted or CLI deploy)

[functions.create-checkout]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.catalog-create-checkout]
verify_jwt = true

[functions.catalog-stripe-webhook]
verify_jwt = false

[functions.kinescope-token]
verify_jwt = true

[functions.catalog-relay-support]
verify_jwt = true

[functions.catalog-claim-support]
verify_jwt = true

[functions.catalog-open-guest-session]
verify_jwt = false

# Guest support chat mints a catalog-only session via catalog-open-guest-session.
# Do not enable GoTrue anonymous globally: this Auth instance is shared with the club.
